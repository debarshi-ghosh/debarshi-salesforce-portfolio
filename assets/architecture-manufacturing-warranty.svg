<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Manufacturing Cloud warranty management reference architecture</title><desc id="d">Conceptual diagram showing regional users, a Salesforce Manufacturing Cloud warranty management platform, Apex and Lightning development, asynchronous and event-driven processing, integrations, security and CI/CD governance.</desc>
