<rect x="55" y="190" width="170" height="135" class="box"/><text x="140" y="235" text-anchor="middle" class="t">Developer</text><text x="140" y="270" text-anchor="middle" class="s">Build / test</text>
<path d="M225 258 H280" class="line" marker-end="url(#a)"/>
<rect x="285" y="190" width="170" height="135" class="primary"/><text x="370" y="235" text-anchor="middle" class="t">Salesforce DX</text><text x="370" y="270" text-anchor="middle" class="s">Source format</text>
<path d="M455 258 H510" class="line" marker-end="url(#a)"/>
<rect x="515" y="190" width="170" height="135" class="primary"/><text x="600" y="235" text-anchor="middle" class="t">Git</text><text x="600" y="270" text-anchor="middle" class="s">Branches / change</text>
<path d="M685 258 H740" class="line" marker-end="url(#a)"/>
<rect x="745" y="190" width="170" height="135" class="primary"/><text x="830" y="235" text-anchor="middle" class="t">Copado</text><text x="830" y="270" text-anchor="middle" class="s">Release orchestration</text>
