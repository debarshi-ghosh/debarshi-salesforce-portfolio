<rect x="975" y="190" width="170" height="135" class="teal"/><text x="1060" y="235" text-anchor="middle" class="t">Validation</text><text x="1060" y="270" text-anchor="middle" class="s">Quality gates</text>
<path d="M1060 325 V420" class="line" marker-end="url(#a)"/>
<rect x="150" y="425" width="900" height="145" class="soft"/><text x="600" y="465" text-anchor="middle" class="t">Environment and release governance</text>
