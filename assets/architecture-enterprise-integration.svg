<rect x="910" y="190" width="235" height="220" class="primary"/><rect x="910" y="190" width="235" height="55" class="dark" rx="16"/><text x="1027" y="225" text-anchor="middle" class="w">Enterprise systems</text><text x="940" y="288" class="t">Connected platforms</text><text x="940" y="324" class="s">Operational systems</text><text x="940" y="356" class="s">External services</text>
