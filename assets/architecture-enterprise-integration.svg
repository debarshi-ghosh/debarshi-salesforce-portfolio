<text x="54" y="88" class="s">API-led and event-driven integration reference architecture</text>
<rect x="55" y="190" width="235" height="220" class="primary"/><rect x="55" y="190" width="235" height="55" class="dark" rx="16"/><text x="172" y="225" text-anchor="middle" class="w">Salesforce</text><text x="85" y="288" class="t">Cloud applications</text><text x="85" y="324" class="s">Apex / LWC / Flows</text><text x="85" y="356" class="s">Business events</text>
